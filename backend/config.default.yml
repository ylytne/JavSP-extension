scanner:
  ignored_id_pattern:
  - (144|240|360|480|720|1080)[Pp]
  - '[24][Kk]'
  - \w+2048\.com
  - Carib(beancom)?
  - '[^a-z\d](f?hd|lt)[^a-z\d]'
  input_directory: null
  filename_extensions:
  - .3gp
  - .avi
  - .f4v
  - .flv
  - .iso
  - .m2ts
  - .m4v
  - .mkv
  - .mov
  - .mp4
  - .mpeg
  - .rm
  - .rmvb
  - .ts
  - .vob
  - .webm
  - .wmv
  - .strm
  - .mpg
  ignored_folder_name_pattern:
  - ^\.
  - ^#recycle$
  - ^#整理完成$
  - ^#不要扫描$
  minimum_size: 232MiB
  # 是否跳过已存在 .nfo 元数据的文件夹（设为 true 可跳过已整理/已刮削完成的影片目录）
  skip_nfo_dir: true
network:
  retry: 3
  timeout: 10.0
  # 各站点的反向代理 / 免代理镜像地址（留空表示使用官方默认主站地址）
  # 例如 javdb: 'https://javdb580.com', airav: 'https://airavplus2.cc'
  proxy_free:
    javbus: ''
    javdb: ''
    airav: ''
crawler:
  sleep_after_scraping: 1.0
  sleep_jitter: 1.0
  # 大批量请求冷却防风控保护 (Burst Protection)
  burst_protection_enabled: true
  burst_limit: 15
  burst_jitter: 5
  burst_cooldown: 20.0
  burst_cooldown_jitter: 10.0
crawlers:
- javbus
- javdb
- airav
dimension_routing:
  cover:
  - javbus
  - airav
  - javdb
  previews:
  - javbus
  - javdb
  chinese:
  - airav
  genre:
  - javdb
  - airav
  - javbus
  actress:
  - javbus
  - javdb
  - airav
  meta:
  - javbus
  - javdb
  - airav
summarizer:
  move_files: true
  path:
    output_directory: null
    output_folder_pattern: '#整理完成/{actress}/[{num}] {title}'
    basename_pattern: '{num}'
    length_maximum: 250
    length_by_byte: true
    max_actress_count: 10
    hard_link: true
  title:
    remove_trailing_actor_name: true
  default:
    title: '#未知标题'
    actress: '#未知女优'
    series: '#未知系列'
    director: '#未知导演'
    producer: '#未知制作商'
    publisher: '#未知发行商'
  nfo:
    # NFO 文件命名规则（无需 .nfo 扩展名）：
    # - 'movie' (推荐默认): Kodi / Jellyfin / Emby 经典单电影文件夹规范 (生成 movie.nfo)
    # - '{filename}': 与最终视频主文件名严格同名 (例如 SSIS-001.nfo 或 [SSIS-001] 标题.nfo)
    # - '{num}': 以番号命名 (例如 SSIS-001.nfo)
    basename_pattern: movie
    title_pattern: '{num} {title}'
    custom_genres_fields:
    - '{genre}'
    - '{censor}'
    custom_tags_fields:
    - '{genre}'
    - '{censor}'
    # 是否将影片“系列”同时写入 NFO 的 <tag> 标签与 <genre> 分类中 (默认开启):
    # - true (默认开启): 自动将系列作为独立标签与流派分类写入，方便在 Jellyfin / Emby / Kodi 中按系列检索与聚合
    # - false: 仅在 <set> 集合节点中记录系列，不额外写入 <tag> 与 <genre>
    serial_as_tag_and_genre: true
    # 是否在 NFO 中写入预告视频链接 (<trailer>)：
    # - false (推荐默认): 不生成 <trailer> 标签。部分站点抓取的 m3u8 实为第三方在线切片流，极易失效/被墙，在 Jellyfin 影院模式下可能导致严重播放卡死
    # - true: 允许写入抓取到的预告视频链接 (仅在网络通畅且需要预告流时开启)
    include_trailer: false
    # 是否开启 NFO 剧情简介 (plot) 清理 (默认开启)
    clean_plot: true
    # 是否清理剧情简介开头出现的番号 (默认开启，自动消除番号与简介之间的空格或分隔符)
    clean_plot_num: true
    # 剧情简介中需要清理的自定义文本或正则列表（不区分大小写，自动消除前后空格）
    plot_clean_patterns:
    - ' - airav.io'
  censor_options_representation:
  - 无码
  - 有码
  - 打码情况未知
  cover:
    basename_pattern: poster
    add_label: false
    use_javdb_cover: fallback
    crop:
      ratio: 1.5
      engine: null
      standard_fanza_crop: true
  fanart:
    basename_pattern: fanart
  extra_fanarts:
    # 是否开启剧照下载与保存 (默认 false，按需在扩展界面或此处开启)
    enabled: false
    # 单通道间隔延时 (秒，并发模式推荐 0 或低延时以防频控)
    scrap_interval: 0
    timeout: 10.0
    max_count: 10
    uniform_sampling: true
    # 剧照并发下载通道数 (1~8，默认 5)
    concurrency: 5
  subtitle:
    enabled: true
    auto_c_suffix: true
    filename_extensions:
    - .srt
    - .vtt
    - .ass
    - .ssa
    - .sbv
    - .idx
    - .sub
translator:
  target_lang: zh-CN
  # 翻译引擎（默认 null 为未启用；可选 google, bing, baidu, claude, openai）
  # 示例（以 OpenAI / 兼容接口为例）：
  # engine:
  #   name: openai
  #   url: https://api.groq.com/openai/v1/chat/completions
  #   api_key: ''
  #   model: qwen/qwen3.8-27b
  engine: null
  fields:
    title: true
    plot: true
server:
  # 服务监听 IP。若在局域网 NAS / Docker 容器中部署，请设为 0.0.0.0 以允许局域网设备连接；本机运行保持 127.0.0.1
  host: 127.0.0.1
  port: 8765
  # API 访问令牌（强烈建议公网/NAS部署时配置）。留空表示禁用鉴权；配置后前端必须提供匹配的 Token 才能访问
  token: ''
